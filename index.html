<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Terrace - 3D project map</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link href="css/app.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>

<div id="map"></div>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark"></span>
    <span class="brand-name">Terrace</span>
    <span class="brand-sub">3D project map</span>
  </div>

  <label class="search">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
    <input id="search" type="search" placeholder="Search projects, builders or cities" autocomplete="off" />
  </label>

  <div class="segmented" id="basemap-switch" role="group" aria-label="Base map"></div>
</header>

<aside class="sidebar" id="sidebar">
  <div class="sidebar-head">
    <div>
      <h2 id="list-count">10 projects</h2>
      <p class="muted">Across 6 cities</p>
    </div>
    <button class="icon-btn" id="sidebar-toggle" title="Collapse list" aria-label="Collapse list">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>
  <div class="filters" id="filters"></div>
  <div class="cards" id="cards"></div>
</aside>

<section class="detail" id="detail" aria-hidden="true"></section>

<div class="hud" id="hud">
  <button class="hud-head" id="hud-toggle">
    <span class="dot"></span>
    <span>Streaming</span>
    <span class="hud-tier" id="hud-tier">pin</span>
  </button>
  <div class="hud-body" id="hud-body">
    <div class="hud-row"><span>In view</span><b id="hud-visible">0</b></div>
    <div class="hud-row"><span>3D models resident</span><b id="hud-resident">0</b></div>
    <div class="hud-row"><span>Loading</span><b id="hud-queued">0</b></div>
    <div class="hud-row"><span>GPU geometry</span><b id="hud-bytes">0 MB</b></div>
    <div class="ladder" id="ladder">
      <div class="rung" data-tier="pin"><b>Pin</b><span>registry only</span></div>
      <div class="rung" data-tier="massing"><b>Massing</b><span>GPU extrusion, no fetch</span></div>
      <div class="rung" data-tier="model"><b>Model</b><span>streamed, on-screen only</span></div>
    </div>
  </div>
</div>

<div class="map-tools">
  <button class="tool" id="btn-globe" title="Globe / flat map" aria-pressed="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
  </button>
  <button class="tool" id="btn-orbit" title="Orbit the selected project">
    <svg viewBox="0 0 24 24"><path d="M12 4a8 8 0 1 1-5.7 2.3"/><path d="M6 3v4h4"/></svg>
  </button>
  <button class="tool" id="btn-reset" title="Back to India view">
    <svg viewBox="0 0 24 24"><path d="M3 12l9-8 9 8"/><path d="M6 10v10h12V10"/></svg>
  </button>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="boot" id="boot">
  <div class="boot-inner">
    <span class="brand-mark big"></span>
    <p>Loading the project map</p>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
