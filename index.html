<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#eef1f5" />
<title>VU - 3D project map</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
<link rel="preconnect" href="https://basemaps.cartocdn.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.css" rel="stylesheet" />
<link href="css/app.css" rel="stylesheet" />

<!-- deferred so the boot screen paints before the map engine parses -->
<script defer src="https://cdn.jsdelivr.net/npm/maplibre-gl@5/dist/maplibre-gl.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<!-- three is needed the moment a project streams; fetch it alongside the map engine -->
<link rel="modulepreload" href="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" />
</head>
<body>

<div id="map"></div>

<header class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" role="img" aria-label="VU">
      <rect class="tile" width="32" height="32" rx="9.5" />
      <!-- A solid V sitting inside an open U: reads as the monogram, and as a lens -->
      <path class="mark" d="M9 9.5v5.5a7 7 0 0 0 14 0V9.5" />
      <path class="wedge" d="M12.2 9.5h7.6L16 16.8z" />
    </svg>
    <span class="brand-name">VU</span>
    <span class="brand-sub">3D project map</span>
  </div>

  <div class="searchwrap">
    <label class="search" for="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" autocomplete="off" spellcheck="false"
             placeholder="Try &ldquo;3 BHK under 1.5 Cr in Pune with a pool&rdquo;"
             aria-label="Search projects" aria-describedby="suggest" />
      <button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden>
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
      <kbd class="search-key">/</kbd>
    </label>
    <div class="suggest" id="suggest" hidden></div>
  </div>

</header>

<aside class="sidebar" id="sidebar">
  <div class="sheet-grip" aria-hidden="true"></div>

  <div class="sidebar-head">
    <div class="sidebar-title">
      <h2 id="list-count">10 projects</h2>
      <p class="muted" id="list-sub">Across 7 cities</p>
    </div>
    <button class="icon-btn" id="sidebar-toggle" title="Hide the list" aria-label="Hide the list">
      <svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>
    </button>
  </div>

  <div class="term-rail" id="terms"></div>

  <div class="sortbar">
    <button class="filter-btn" id="btn-filter" aria-expanded="false">
      <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M7 12h10"/><path d="M10 18h4"/></svg>
      <span>Filters</span>
      <span class="badge" id="filter-badge" hidden>0</span>
    </button>
    <div class="select">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 8h13"/><path d="M7 14h9"/><path d="M7 20h5"/><path d="M3 7l1.5-2L6 7"/></svg>
      <select id="sort" aria-label="Sort projects"></select>
      <svg class="caret" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5"/></svg>
    </div>
  </div>

  <div class="cards" id="cards"></div>

  <section class="filter-panel" id="filter-panel" aria-hidden="true">
    <div class="filter-head">
      <h2>Filters</h2>
      <button class="icon-btn" id="filter-close" aria-label="Close filters">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg>
      </button>
    </div>
    <div class="filter-body" id="filter-body"></div>
    <div class="filter-foot">
      <button class="btn ghost wide" id="filter-reset">Reset</button>
      <button class="btn primary" id="filter-apply">Show 10 projects</button>
    </div>
  </section>
</aside>

<button class="fab" id="btn-projects" aria-label="Show the project list">
  <svg viewBox="0 0 24 24"><path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h10"/></svg>
  <span class="fab-label">Projects</span>
  <span class="fab-count" id="fab-count">10</span>
</button>

<section class="detail" id="detail" aria-hidden="true"></section>

<div class="map-ui" id="map-ui">
  <div class="ctrl-group">
    <button class="ctrl" id="btn-zoom-in" data-tip="Zoom in" aria-label="Zoom in">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="ctrl" id="btn-zoom-out" data-tip="Zoom out" aria-label="Zoom out">
      <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
    </button>
  </div>

  <button class="ctrl compass" id="btn-compass" data-tip="Face north" aria-label="Reset bearing to north">
    <svg viewBox="0 0 24 24" class="needle"><path d="M12 3.5l4 13-4-2.6-4 2.6z" fill="currentColor" stroke="none"/></svg>
  </button>

  <div class="ctrl-group">
    <button class="ctrl" id="btn-3d" data-tip="Terrain &amp; city buildings" aria-pressed="true" aria-label="Terrain and city buildings">
      <svg viewBox="0 0 24 24"><path d="M3 20l6-9 4 5 3-4 5 8z"/><path d="M2 20h20"/></svg>
    </button>
    <button class="ctrl" id="btn-globe" data-tip="Globe / flat map" aria-pressed="true" aria-label="Toggle globe view">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18"/><path d="M12 3a14 14 0 0 1 0 18a14 14 0 0 1 0-18"/></svg>
    </button>
    <button class="ctrl" id="btn-orbit" data-tip="Orbit the project" aria-pressed="false" aria-label="Orbit the selected project">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><ellipse cx="12" cy="12" rx="9.5" ry="4.4" transform="rotate(-28 12 12)"/></svg>
    </button>
    <button class="ctrl" id="btn-reset" data-tip="Back to India" aria-label="Back to the country view">
      <svg viewBox="0 0 24 24"><path d="M4 11.5L12 5l8 6.5"/><path d="M6.5 10.5V19h11v-8.5"/><path d="M10 19v-4.5h4V19"/></svg>
    </button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="boot" id="boot">
  <div class="boot-inner">
    <svg class="logo big" viewBox="0 0 32 32" role="img" aria-label="VU">
      <rect class="tile" width="32" height="32" rx="9.5" />
      <!-- A solid V sitting inside an open U: reads as the monogram, and as a lens -->
      <path class="mark" d="M9 9.5v5.5a7 7 0 0 0 14 0V9.5" />
      <path class="wedge" d="M12.2 9.5h7.6L16 16.8z" />
    </svg>
    <p>Loading the project map</p>
    <div class="boot-bar"><i></i></div>
  </div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
